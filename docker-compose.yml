# Levanta todo el proyecto en local: docker compose up --build
# Antes: copia .env.example como .env y llena los valores.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build: ./backend
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - chroma:/app/chroma_data
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ollama:
  chroma:
