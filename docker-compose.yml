# Levanta backend y frontend en local: docker compose up --build
# Antes: copia .env.example como .env y llena los valores.
# Ollama corre directamente en Windows (no en Docker); el backend lo alcanza
# por host.docker.internal. pgvector vive en Supabase.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_USER: ""
      OLLAMA_PASS: ""
      FRONTEND_URL: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
